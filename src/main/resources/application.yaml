server:
  port: 8083

spring:

  config:
    import: optional:file:.env[.properties]

  application:
    name: sawit-panen

  datasource:
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require&channelBinding=require
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    hibernate:
      ddl-auto: update

grpc:
  server:
    enabled: ${GRPC_SERVER_ENABLED:true}
    port: ${GRPC_PORT:9093}

internal:
  grpc:
    auth:
      enabled: ${AUTH_GRPC_ENABLED:true}
      host: ${AUTH_GRPC_HOST:localhost}
      port: ${AUTH_GRPC_PORT:9091}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
